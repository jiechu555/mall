spring:
  application:
    name: mall-portal
  profiles:
    active: dev #默认为开发环境
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis:
  mapper-locations:
    - classpath:dao/*.xml
    - classpath*:com/**/mapper/*.xml

jwt:
  tokenHeader: Authorization #JWT存储的请求头
  secret: mall-portal-secret #JWT加解密使用的密钥
  expiration: 604800 #JWT的超期限时间(60*60*24*7)
  tokenHead: 'Bearer '  #JWT负载中拿到开头

secure:
  ignored:
    urls: #安全路径白名单
      - /swagger-ui/
      - /v3/api-docs/*
      - /*/*.html
      - /*/*.js
      - /*/*.css
      - /*/*.png
      - /favicon.ico
      - /actuator/**
      - /druid/**
      - /sso/**
      - /home/**
      - /product/**
      - /brand/**
      - /alipay/**

springdoc:
  swagger-ui:
    # 修改Swagger UI路径
    path: /swagger-ui.html
    # 开启Swagger UI界面
    enabled: true
    # 用于配置tag和operation的展开方式，这里配置为都不展开
    doc-expansion: 'none'
  api-docs:
    # 修改api-docs路径
    path: /v3/api-docs
    # 开启api-docs
    enabled: true
  group-configs:
    - group: 'mall-portal'
      packages-to-scan: com.macro.mall.portal.controller

# 自定义redis key
redis:
  database: mall
  key:
    authCode: 'ums:authCode'
    orderId: 'oms:orderId'
    member: 'ums:member'
    flashSaleStock: 'sms:flashSaleStock'   # 完整key: mall:sms:flashSaleStock:{活动id}:{场次id}:{商品id}
    flashSaleBought: 'sms:flashSaleBought' # 已购Hash: field=memberId, value=件数
    flashSaleToken: 'sms:flashSaleToken'   # 秒杀令牌Set: mall:sms:flashSaleToken:{活动id}:{场次id}
    flashSaleRate: 'sms:flashSaleRate'     # 用户级限流: mall:sms:flashSaleRate:{memberId}
    flashSaleTicket: 'sms:flashSaleTicket' # 受理号: mall:sms:flashSaleTicket:{ticket}，5分钟
  expire:
    authCode: 90 # 验证码超期时间
    common: 86400 # 24小时

# 秒杀模块总开关（压测/灰度/回滚都用它）
seckill:
  enabled: true

# AI 客服模块（RAG）
# 开关语义（设计文档 08 讲第五节定案）：ai.enabled 仅条件装配外部 API Bean（OpenAiApi/AiEmbeddingClient），
# Controller 与 BM25 检索常驻——关闭时 /ai/chat 走纯 BM25 降级（degraded:true）。
# key 三级注入（优先级从高到低）：环境变量 AI_API_KEY > application-local.yml（不入库） > 此处空串
ai:
  enabled: false
  base-url: https://open.bigmodel.cn/api/paas/v4   # 智谱 OpenAI 兼容端点
  api-key: ''
  completions-path: /chat/completions              # 智谱 v4 不带 /v1 前缀（实测确认）
  embeddings-path: /embeddings
  chat-model: glm-4-flash
  chat-timeout-ms: 10000
  embedding-model: embedding-2
  embedding-dims: 1024                             # 必须与 ES ai_kb mapping 的 dense_vector dims 一致

mongo:
  insert:
    sqlEnable: true # 用于控制是否通过数据库数据来插入mongo

# 消息队列定义
rabbitmq:
  queue:
    name:
      cancelOrder: cancelOrderQueue

